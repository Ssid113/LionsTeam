<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Спортивная школа — Онлайн запись</title>
 <script src="https://telegram.org/js/telegram-web-app.js"></script>
 <style>
 :root {
 --bg-color: var(--tg-theme-bg-color, #ffffff);
 --text-color: var(--tg-theme-text-color, #222222);
 --hint-color: var(--tg-theme-hint-color, #888888);
 --btn-color: var(--tg-theme-button-color, #2481cc);
 --btn-text-color: var(--tg-theme-button-text-color, #ffffff);
 --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
 }

 * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
 body { background-color: var(--bg-color); color: var(--text-color); padding: 12px; padding-bottom: 32px; }

 /* Переключатель вкладок */
 .tabs { display: flex; margin-bottom: 12px; border-bottom: 2px solid var(--secondary-bg); }
 .tab-btn { flex: 1; padding: 10px; text-align: center; font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent; }
 .tab-btn.active { border-color: var(--btn-color); color: var(--btn-color); }

 /* Заголовки календарей */
 .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; }
 .calendar-nav { cursor: pointer; padding: 6px 16px; background: var(--secondary-bg); border-radius: 6px; font-size: 16px; user-select: none; }

 /* Фильтры и поиск */
 .filter-container {
 background: var(--secondary-bg);
 padding: 8px 12px;
 border-radius: 10px;
 margin-bottom: 12px;
 display: flex;
 align-items: center;
 justify-content: space-between;
 font-size: 13px;
 }
 .filter-container label {
 font-weight: bold;
 color: var(--text-color);
 margin-bottom: 0;
 }
 .filter-select {
 padding: 6px 10px;
 border-radius: 8px;
 border: 1px solid #ccc;
 background-color: var(--bg-color);
 color: var(--text-color);
 font-size: 13px;
 outline: none;
 }

 /* Блок поиска броней по телефону */
 .search-box {
 background: var(--secondary-bg);
 padding: 10px 12px;
 border-radius: 10px;
 margin-bottom: 12px;
 display: flex;
 gap: 8px;
 }
 .search-box input {
 flex: 1;
 margin-bottom: 0;
 padding: 8px 10px;
 font-size: 13px;
 }
 .search-box button {
 padding: 8px 14px;
 background: var(--btn-color);
 color: var(--btn-text-color);
 border: none;
 border-radius: 8px;
 font-weight: bold;
 cursor: pointer;
 }

 /* Недельный календарь */
 .week-grid {
 display: grid;
 grid-template-columns: repeat(4, 1fr);
 gap: 6px;
 margin-bottom: 12px;
 }
 .week-day {
 background: var(--secondary-bg); border-radius: 8px; padding: 6px 4px; text-align: center; cursor: pointer;
 border: 2px solid transparent; transition: all 0.2s;
 }
 .week-day.selected { border-color: var(--btn-color); background: var(--bg-color); }
 .week-day-name { font-size: 11px; color: var(--hint-color); text-transform: uppercase; font-weight: bold; }
 .week-day-num { font-size: 15px; font-weight: bold; margin: 2px 0; }
 .week-day-events { font-size: 9px; color: var(--btn-color); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

 /* Месячный календарь */
 .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; text-align: center; }
 .month-day-header { font-size: 11px; color: var(--hint-color); padding: 4px 0; font-weight: bold; }
 .month-day {
 background: var(--secondary-bg); border-radius: 8px; min-height: 46px; padding: 4px; cursor: pointer;
 border: 2px solid transparent; position: relative; font-size: 13px; font-weight: 500;
 }
 .month-day.other-month { opacity: 0.3; }
 .month-day.selected { border-color: var(--btn-color); background: var(--bg-color); }
 .month-day.has-booking { background: #e3f2fd; }
 .booking-badge {
 position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
 background: var(--btn-color); color: #fff; font-size: 9px; padding: 1px 4px; border-radius: 4px; white-space: nowrap;
 }

 /* Блок статистики и абонементов */
 .stats-card {
 background: var(--secondary-bg);
 border-radius: 10px;
 padding: 10px 12px;
 margin-bottom: 14px;
 font-size: 13px;
 }
 .stats-title {
 font-weight: bold;
 margin-bottom: 6px;
 color: var(--btn-color);
 display: flex;
 justify-content: space-between;
 }
 .stats-unpaid {
 color: #c62828;
 font-weight: bold;
 margin-top: 4px;
 padding-top: 4px;
 border-top: 1px dashed rgba(0,0,0,0.12);
 display: flex;
 justify-content: space-between;
 }
 .stats-item {
 display: flex;
 justify-content: space-between;
 padding: 3px 0;
 border-bottom: 1px dashed rgba(0,0,0,0.08);
 }
 .stats-item:last-child { border-bottom: none; }

 /* Стили таблицы абонементов */
 .sub-table {
 width: 100%;
 border-collapse: collapse;
 margin-top: 8px;
 font-size: 12px;
 }
 .sub-table th {
 text-align: left;
 padding: 6px;
 background: rgba(0,0,0,0.05);
 border-bottom: 1px solid rgba(0,0,0,0.1);
 }
 .sub-table td {
 padding: 6px;
 border-bottom: 1px dashed rgba(0,0,0,0.1);
 }
 .sub-summary {
 font-weight: bold;
 cursor: pointer;
 color: var(--btn-color);
 outline: none;
 padding: 2px 0;
 user-select: none;
 }

 /* Карточки занятий */
 .card { background-color: var(--secondary-bg); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 2px solid transparent; }
 .card.selected { border-color: var(--btn-color); background-color: var(--bg-color); }
 .card-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; display: flex; justify-content: space-between; }
 .card-subtitle { font-size: 13px; color: var(--hint-color); margin-bottom: 6px; }

/* Бейджи статусов */
.card-badge { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 6px; margin-right: 4px; }
.badge-age { background-color: #e3f2fd; color: #0d47a1; font-weight: bold; }
.badge-seats { background-color: #e8f5e9; color: #1b5e20; }
.badge-full { background-color: #ffebee; color: #c62828; }
.badge-closed { background-color: #eee; color: #666; }
.badge-status { background-color: #fff3e0; color: #e65100; font-weight: bold; }

/* Зелёный бейдж специально для статуса "Забронировано" */
.badge-status-booked { background-color: #e8f5e9; color: #2e7d32; font-weight: bold; }

/* Подсветка карточки брони при статусе "Оплачено" */
.card.paid {
  background-color: #f1f8e9;
  border-color: #aed581;
}

 /* Список участников */
 .participants-toggle {
 font-size: 12px; color: var(--btn-color); font-weight: bold; margin-top: 8px; cursor: pointer; display: inline-block;
 }
 .participants-list {
 display: none; margin-top: 6px; padding: 8px; background: rgba(0,0,0,0.04); border-radius: 6px; font-size: 12px;
 }
 .participants-item { padding: 4px 0; color: var(--text-color); border-bottom: 1px dashed #ccc; }
 .participants-item:last-child { border-bottom: none; }

 /* Формы и кнопки */
 .btn-cancel {
 width: 100%; padding: 8px; border: 1px solid #d32f2f; color: #d32f2f; background: transparent;
 border-radius: 6px; font-weight: bold; margin-top: 8px; cursor: pointer;
 }
 .form-group { margin-top: 12px; }
 label { display: block; font-size: 12px; color: var(--hint-color); margin-bottom: 4px; }
 input, select {
 width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;
 background-color: var(--bg-color); color: var(--text-color); font-size: 14px; margin-bottom: 10px; outline: none;
 }
 input:focus, select:focus { border-color: var(--btn-color); }

 .btn-submit {
 width: 100%; padding: 12px; border: none; border-radius: 10px;
 background-color: var(--btn-color); color: var(--btn-text-color); font-size: 15px; font-weight: bold; cursor: pointer;
 }
 .btn-submit:disabled { opacity: 0.5; }
 .loading { text-align: center; padding: 20px; color: var(--hint-color); }
 
 .alert-banner {
 padding: 10px; border-radius: 8px; background: #e8f5e9; color: #1b5e20;
 font-size: 13px; font-weight: bold; margin-bottom: 12px; text-align: center; display: none;
 }
 </style>
</head>
<body>

 <!-- URL вашего Apps Script Web App -->
 <script>
 const API_URL = "https://script.google.com/macros/s/AKfycbyMNQe4A2dzc-kR2KKGA-lJjHOK4WGw8jUXwEao2NHp3OFZcDFUnmtcCxslFbq6sah2Ow/exec";
 </script>

 <div id="statusBanner" class="alert-banner"></div>

 <!-- Вкладки управления -->
 <div class="tabs">
 <div class="tab-btn active" id="tabSchedule" onclick="switchTab('schedule')">📅 Записаться</div>
 <div class="tab-btn" id="tabMyBookings" onclick="switchTab('myBookings')">🎟️ Мои записи</div>
 </div>

 <!-- Раздел: Записаться на тренировку -->
 <div id="sectionSchedule">
 <div class="calendar-header">
 <span id="weekTitle">Расписание недели</span>
 <div>
 <span class="calendar-nav" onclick="changeWeek(-1)">←</span>
 <span class="calendar-nav" onclick="changeWeek(1)">→</span>
 </div>
 </div>

 <!-- Фильтр по году рождения ребёнка -->
 <div class="filter-container">
 <label for="birthYearFilter">👶 Год рождения ребёнка:</label>
 <select id="birthYearFilter" class="filter-select" onchange="applyYearFilter()">
 <option value="">Все годы</option>
 </select>
 </div>
 
 <div id="weekCalendar" class="week-grid"></div>

 <div id="loadingSchedule" class="loading">Загрузка занятий...</div>
 <div id="slotsList"></div>

 <div id="bookingForm" class="form-group" style="display: none;">
 <h3 style="margin-bottom: 8px; font-size: 16px;">Данные для записи</h3>
 
 <label>ФИО Клиента / Родителя *</label>
 <input type="text" id="clientName" placeholder="Иванов Иван" required>

 <label>Номер телефона * (только цифры)</label>
 <input type="tel" id="clientPhone" placeholder="79161112223" maxlength="11" class="only-digits" required>

 <label>ФИО ребёнка *</label>
 <input type="text" id="childName" placeholder="Иванов Алексей" required>

 <label>Год рождения ребёнка *</label>
 <input type="number" id="childBirthYear" placeholder="2015" min="2000" max="2026" required>

 <button type="button" class="btn-submit" id="submitBtn" onclick="submitBooking()">Подтвердить запись</button>
 </div>
 </div>

 <!-- Раздел: Мои записи -->
 <div id="sectionMyBookings" style="display: none;">
 <!-- Блок поиска записей по номеру телефона (управляется ключом USER_FIND_BOOKINGS) -->
 <div class="search-box" id="searchBoxContainer">
 <input type="tel" id="searchPhoneInput" placeholder="Номер телефона (только 11 цифр)" maxlength="11" class="only-digits" />
 <button onclick="searchBookingsByPhone()">Найти</button>
 </div>

 <div class="calendar-header">
 <span id="monthTitle"></span>
 <div>
 <span class="calendar-nav" onclick="changeMonth(-1)">←</span>
 <span class="calendar-nav" onclick="changeMonth(1)">→</span>
 </div>
 </div>

 <div id="monthCalendar" class="month-grid"></div>

 <!-- Краткая статистика за месяц (управляется ключом USER_V_STAT) -->
 <div id="monthlyStats" class="stats-card" style="display: none;"></div>

 <!-- ВЫПАДАЮЩАЯ ТАБЛИЦА АБОНЕМЕНТОВ ПОД СТАТИСТИКОЙ (управляется ключом USER_V_SUB) -->
 <div id="subscriptionsContainer" class="stats-card" style="display: none;"></div>

 <div id="loadingMyBookings" class="loading">Загрузка ваших записей...</div>
 <div id="myBookingsList"></div>
 </div>

 <script>
 let tg = window.Telegram?.WebApp;
 let isTelegram = false;

 let allSessions = [];
 let myBookings = [];
 let subscriptionsList = []; // Глобальный массив с данными абонементов
 let selectedSession = null;
 let currentChatId = "";
 let userPhone = "";
 let selectedBirthYearFilter = "";

 let currentWeekOffset = 0;
 let selectedScheduleDate = formatDate(new Date());

 let currentMonthDate = new Date();
 let selectedMyBookingDate = formatDate(new Date());

 /**
  * ГЛОБАЛЬНЫЙ ОБЪЕКТ НАСТРОЕК ИНТЕГРАЦИИ
  * Настройки считываются с листа "Настройки интеграции" Google Таблицы:
  * - USER_V_STAT: Показ статистики клиентам за месяц (true/false)
  * - USER_CANCEL: Возможность отмены брони клиентом (true/false)
  * - USER_CANCEL_TIME: Мин. время в минутах до занятия, когда разрешена отмена
  * - USER_V_SIGUP: Отображение списка записавшихся участников (true/false)
  * - USER_MAX_BOOKINGS_DAY: Лимит активных заявок на день (0 - без ограничений)
  * - USER_FIND_BOOKINGS: Поиск броней по номеру телефона (true/false)
  * - USER_V_SUB: Отображение блока информации об абонементах (true/false)
  */
 let appConfig = {
   USER_V_STAT: true,
   USER_CANCEL: true,
   USER_CANCEL_TIME: 60,
   USER_V_SIGUP: true,
   USER_MAX_BOOKINGS_DAY: 3,
   USER_FIND_BOOKINGS: true,
   USER_V_SUB: true
 };

 document.addEventListener("DOMContentLoaded", function() {
 initEnvironment();
 initYearFilterOptions();
 setupDigitsOnlyValidation();

 loadSchedule(true);

 setInterval(() => {
 loadSchedule(false);
 }, 300000);
 });

 /**
  * Управление элементами UI в зависимости от переданных настроек
  */
 function applyConfigUI() {
   // [USER_FIND_BOOKINGS]: Отображение/скрытие блока поиска броней по телефону
   const searchBox = document.getElementById("searchBoxContainer");
   if (searchBox) {
     searchBox.style.display = (appConfig.USER_FIND_BOOKINGS !== false) ? "flex" : "none";
   }

   // [USER_V_STAT]: Скрытие блока статистики за месяц, если флаг выключен
   const statsContainer = document.getElementById("monthlyStats");
   if (statsContainer && appConfig.USER_V_STAT === false) {
     statsContainer.style.display = "none";
   }

   // [USER_V_SUB]: Скрытие выпадающей таблицы абонементов, если флаг выключен
   const subContainer = document.getElementById("subscriptionsContainer");
   if (subContainer && appConfig.USER_V_SUB === false) {
     subContainer.style.display = "none";
   }
 }

 // Настройка строгой фильтрации ввода: разрешены ТОЛЬКО ЦИФРЫ
 function setupDigitsOnlyValidation() {
 document.querySelectorAll(".only-digits").forEach(input => {
 input.addEventListener("input", function() {
 this.value = this.value.replace(/\D/g, "");
 });
 input.addEventListener("paste", function(e) {
 e.preventDefault();
 const pastedText = (e.clipboardData || window.clipboardData).getData("text");
 this.value = pastedText.replace(/\D/g, "").substring(0, 11);
 });
 input.addEventListener("keypress", function(e) {
 if (!/\d/.test(e.key)) {
 e.preventDefault();
 }
 });
 });
 }

 function initEnvironment() {
 if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
 isTelegram = true;
 tg.ready();
 tg.expand();
 const user = tg.initDataUnsafe.user;
 currentChatId = String(user.id);
 const fullName = [user.first_name, user.last_name].filter(Boolean).join(" ");
 if (fullName) document.getElementById("clientName").value = fullName;
 } else {
 isTelegram = false;
 currentChatId = localStorage.getItem("web_chat_id") || "";
 userPhone = localStorage.getItem("user_phone") || "";

 if (!currentChatId) {
 currentChatId = "WEB_" + Math.floor(100000 + Math.random() * 900000);
 localStorage.setItem("web_chat_id", currentChatId);
 }

 if (userPhone) {
 document.getElementById("searchPhoneInput").value = userPhone;
 document.getElementById("clientPhone").value = userPhone;
 }

 const savedName = localStorage.getItem("user_client_name");
 if (savedName) document.getElementById("clientName").value = savedName;
 }
 }

 function initYearFilterOptions() {
 const select = document.getElementById("birthYearFilter");
 for (let y = 2026; y >= 2000; y--) {
 const opt = document.createElement("option");
 opt.value = String(y);
 opt.innerText = `${y} г.р.`;
 select.appendChild(opt);
 }
 }

 function applyYearFilter() {
 selectedBirthYearFilter = document.getElementById("birthYearFilter").value;
 selectedSession = null;
 document.getElementById("bookingForm").style.display = "none";
 renderScheduleForDate(selectedScheduleDate);
 }

 function showBanner(message, isError = false) {
 const banner = document.getElementById("statusBanner");
 banner.innerText = message;
 banner.style.background = isError ? "#ffebee" : "#e8f5e9";
 banner.style.color = isError ? "#c62828" : "#1b5e20";
 banner.style.display = "block";
 setTimeout(() => { banner.style.display = "none"; }, 6000);
 }

 function switchTab(tab) {
 document.getElementById("tabSchedule").classList.toggle("active", tab === 'schedule');
 document.getElementById("tabMyBookings").classList.toggle("active", tab === 'myBookings');

 document.getElementById("sectionSchedule").style.display = tab === 'schedule' ? 'block' : 'none';
 document.getElementById("sectionMyBookings").style.display = tab === 'myBookings' ? 'block' : 'none';

 if (tab === 'schedule') {
 loadSchedule(false);
 }
 if (tab === 'myBookings') {
 loadMyBookings();
 }
 }

 function loadSchedule(showLoader = true) {
 if (showLoader) document.getElementById("loadingSchedule").style.display = "block";
 fetch(`${API_URL}?action=getSchedule`)
 .then(res => res.json())
 .then(data => {
 document.getElementById("loadingSchedule").style.display = "none";
 if (data.status === "success") {
 if (data.config) {
 appConfig = Object.assign(appConfig, data.config);
 applyConfigUI();
 }

 if (data.subscriptions) {
 subscriptionsList = data.subscriptions;
 }

 allSessions = data.sessions;
 renderWeekCalendar();
 renderScheduleForDate(selectedScheduleDate);
 }
 })
 .catch(() => {
 document.getElementById("loadingSchedule").style.display = "none";
 });
 }

 function getMonday(d, weekOffset = 0) {
 const date = new Date(d);
 const day = date.getDay();
 const diff = date.getDate() - day + (day === 0 ? -6 : 1);
 const monday = new Date(date.setDate(diff));
 monday.setDate(monday.getDate() + (weekOffset * 7));
 return monday;
 }

 function renderWeekCalendar() {
 const calendar = document.getElementById("weekCalendar");
 calendar.innerHTML = "";

 const monday = getMonday(new Date(), currentWeekOffset);

 for (let i = 0; i < 7; i++) {
 const d = new Date(monday);
 d.setDate(monday.getDate() + i);
 const dateStr = formatDate(d);

 const daySessions = allSessions.filter(s => {
 if (s.date !== dateStr) return false;
 if (selectedBirthYearFilter !== "") {
 const yr = Number(selectedBirthYearFilter);
 if (yr < s.yearFrom || yr > s.yearTo) return false;
 }
 return true;
 });

 const dayEl = document.createElement("div");
 dayEl.className = `week-day ${dateStr === selectedScheduleDate ? 'selected' : ''}`;
 
 let eventsHtml = "";
 daySessions.slice(0, 2).forEach(s => {
 eventsHtml += `<div class="week-day-events">${s.title} ${s.time}</div>`;
 });
 if (daySessions.length > 2) eventsHtml += `<div class="week-day-events">+${daySessions.length - 2} еще</div>`;

 dayEl.innerHTML = `
 <div class="week-day-name">${d.toLocaleDateString('ru-RU', { weekday: 'short' })}</div>
 <div class="week-day-num">${d.getDate()}</div>
 ${eventsHtml}
 `;

 dayEl.onclick = () => {
 selectedScheduleDate = dateStr;
 selectedSession = null;
 document.getElementById("bookingForm").style.display = "none";

 document.querySelectorAll(".week-day").forEach(el => el.classList.remove("selected"));
 dayEl.classList.add("selected");
 renderScheduleForDate(dateStr);
 };

 calendar.appendChild(dayEl);
 }
 }

 function changeWeek(offset) {
 currentWeekOffset += offset;
 selectedSession = null;
 document.getElementById("bookingForm").style.display = "none";
 renderWeekCalendar();
 }

 function renderScheduleForDate(dateStr) {
 const container = document.getElementById("slotsList");
 container.innerHTML = "";

 const sessions = allSessions
 .filter(s => {
 if (s.date !== dateStr) return false;
 if (selectedBirthYearFilter !== "") {
 const year = Number(selectedBirthYearFilter);
 if (year < s.yearFrom || year > s.yearTo) return false;
 }
 return true;
 })
 .sort((a, b) => a.time.localeCompare(b.time));

 if (sessions.length === 0) {
 const filterMsg = selectedBirthYearFilter ? ` для ${selectedBirthYearFilter} г.р.` : '';
 container.innerHTML = `<div class="loading">На выбранную дату (${dateStr})${filterMsg} нет доступных занятий.</div>`;
 document.getElementById("bookingForm").style.display = "none";
 return;
 }

 sessions.forEach(session => {
 const card = document.createElement("div");
 card.className = "card";
 if (selectedSession && selectedSession.id === session.id) {
 card.classList.add("selected");
 }

 let badgeClass = "badge-seats";
 let statusText = `Свободно: ${session.freeSeats}`;

 if (session.status === "Запись закрыта" || session.isPast) {
 badgeClass = "badge-closed";
 statusText = "Запись закрыта";
 } else if (session.status === "Мест нет" || session.freeSeats <= 0) {
 badgeClass = "badge-full";
 statusText = "Мест нет";
 }

 let participantsHtml = "";
 // [USER_V_SIGUP]: Отрисовка списка участников производится ТОЛЬКО при включенном ключе
 if (appConfig.USER_V_SIGUP !== false) {
 if (session.participants && session.participants.length > 0) {
 let items = session.participants.map(p => 
 `<div class="participants-item">👤 ${p.childName} (${p.childBirthYear} г.р.)</div>`
 ).join("");

 participantsHtml = `
 <div class="participants-toggle" onclick="toggleParticipants('part-${session.id}', event)">
 👥 Записались (${session.participants.length} чел.) ▼
 </div>
 <div id="part-${session.id}" class="participants-list">
 ${items}
 </div>
 `;
 } else {
 participantsHtml = `<div style="font-size: 11px; color: var(--hint-color); margin-top: 6px;">👥 Пока никто не записан</div>`;
 }
 }

 card.innerHTML = `
 <div class="card-title">
 <span>${session.title}</span>
 <span>${session.price > 0 ? session.price + ' ₽' : 'Бесплатно'}</span>
 </div>
 <div class="card-subtitle">
 ⏰ ${session.time} (${session.duration}) | 👨‍🏫 ${session.coach}<br>
 📍 ${session.location}
 </div>
 <div>
 <span class="card-badge badge-age">${session.yearFrom}–${session.yearTo} г.р.</span>
 <span class="card-badge ${badgeClass}">${statusText}</span>
 </div>
 ${participantsHtml}
 `;

 if (session.status === "Открыта запись" && !session.isPast && session.freeSeats > 0) {
 card.onclick = (e) => {
 if (!e.target.classList.contains('participants-toggle')) {
 selectSlot(session, card);
 }
 };
 } else {
 card.style.opacity = "0.85";
 }

 container.appendChild(card);
 });
 }

 function toggleParticipants(elementId, event) {
 event.stopPropagation();
 const list = document.getElementById(elementId);
 if (list) {
 list.style.display = list.style.display === "block" ? "none" : "block";
 }
 }

 function selectSlot(session, element) {
 selectedSession = session;
 document.querySelectorAll("#slotsList .card").forEach(c => c.classList.remove("selected"));
 element.classList.add("selected");
 document.getElementById("bookingForm").style.display = "block";

 if (selectedBirthYearFilter && !document.getElementById("childBirthYear").value) {
 document.getElementById("childBirthYear").value = selectedBirthYearFilter;
 }
 }

 function submitBooking() {
 const name = document.getElementById("clientName").value.trim();
 const rawPhone = document.getElementById("clientPhone").value.trim();
 const childName = document.getElementById("childName").value.trim();
 const childYear = parseInt(document.getElementById("childBirthYear").value);

 const phoneDigits = rawPhone.replace(/\D/g, "");

 if (!selectedSession || !name || !phoneDigits || !childName || isNaN(childYear)) {
 alert("Заполните все обязательные поля. Номер телефона должен содержать только цифры.");
 return;
 }

 if (childYear < selectedSession.yearFrom || childYear > selectedSession.yearTo) {
 alert(`Возраст ребенка должен быть от ${selectedSession.yearFrom} до ${selectedSession.yearTo} г.р.`);
 return;
 }

 // [USER_MAX_BOOKINGS_DAY]: Проверка максимального кол-ва активных броней на дату на стороне клиента
 const maxLimit = Number(appConfig.USER_MAX_BOOKINGS_DAY) || 0;
 if (maxLimit > 0) {
 const activeBookingsForDate = myBookings.filter(b => 
 b.sessionDate === selectedSession.date && b.status === "Забронировано"
 );
 if (activeBookingsForDate.length >= maxLimit) {
 alert(`Превышен лимит активных броней! Максимально допустимое число броней в день: ${maxLimit}.`);
 return;
 }
 }

 const btn = document.getElementById("submitBtn");
 btn.disabled = true;
 btn.innerText = "Запись...";

 if (!isTelegram) {
 localStorage.setItem("user_phone", phoneDigits);
 localStorage.setItem("user_client_name", name);
 userPhone = phoneDigits;
 }

 const tgUser = (isTelegram && tg.initDataUnsafe) ? (tg.initDataUnsafe.user || {}) : {};

 fetch(API_URL, {
 method: "POST",
 redirect: "follow",
 headers: { "Content-Type": "text/plain;charset=utf-8" },
 body: JSON.stringify({
 action: "createBooking",
 sessionId: selectedSession.id,
 clientName: name,
 clientPhone: phoneDigits,
 childName: childName,
 childBirthYear: childYear,
 telegramUsername: tgUser.username ? `@${tgUser.username}` : "Web User",
 chatId: currentChatId
 })
 })
 .then(res => res.text())
 .then(textData => {
 let res;
 try { res = JSON.parse(textData); } catch(e) { res = { status: "success" }; }

 if (res.status === "success") {
 showBanner(`✅ Вы успешно записаны! Номер брони: ${res.bookingId || 'Успешно'}`);
 if (isTelegram && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
 
 selectedSession = null;
 document.getElementById("bookingForm").style.display = "none";
 document.getElementById("childName").value = "";

 loadSchedule(false);
 } else {
 showBanner(`❌ Ошибка: ${res.message || 'Не удалось забронировать'}`, true);
 loadSchedule(false);
 }
 btn.disabled = false;
 btn.innerText = "Подтвердить запись";
 })
 .catch(() => {
 showBanner("✅ Заявка отправлена! Проверьте раздел «Мои записи».");
 selectedSession = null;
 document.getElementById("bookingForm").style.display = "none";
 
 loadSchedule(false);
 btn.disabled = false;
 btn.innerText = "Подтвердить запись";
 });
 }

 // --- МОИ ЗАПИСИ, СТАТИСТИКА И АБОНЕМЕНТЫ ---
 function loadMyBookings() {
 if (appConfig.USER_FIND_BOOKINGS === false) {
 document.getElementById("myBookingsList").innerHTML = `<div class="loading">Просмотр и поиск броней временно отключены администратором.</div>`;
 document.getElementById("monthlyStats").style.display = "none";
 document.getElementById("subscriptionsContainer").style.display = "none";
 return;
 }

 document.getElementById("loadingMyBookings").style.display = "block";
 
 const searchUrl = `${API_URL}?action=getUserBookings&chat_id=${encodeURIComponent(currentChatId)}&phone=${encodeURIComponent(userPhone)}`;

 fetch(searchUrl)
 .then(res => res.json())
 .then(data => {
 document.getElementById("loadingMyBookings").style.display = "none";
 if (data.status === "success") {
 if (data.config) {
 appConfig = Object.assign(appConfig, data.config);
 applyConfigUI();
 }

 if (data.subscriptions) {
 subscriptionsList = data.subscriptions;
 }

 myBookings = data.bookings;
 renderMonthCalendar();
 renderMonthlyStats();
 renderSubscriptions(); // Отрисовка абонементов для текущего месяца
 renderMyBookingsForDate(selectedMyBookingDate);
 }
 });
 }

 function searchBookingsByPhone() {
 if (appConfig.USER_FIND_BOOKINGS === false) {
 alert("Поиск броней по номеру телефона отключен администратором.");
 return;
 }

 const rawInput = document.getElementById("searchPhoneInput").value.trim();
 const phoneDigits = rawInput.replace(/\D/g, "");

 if (!phoneDigits) {
 alert("Введите номер телефона (только цифры).");
 return;
 }

 userPhone = phoneDigits;
 document.getElementById("searchPhoneInput").value = phoneDigits;
 localStorage.setItem("user_phone", userPhone);
 loadMyBookings();
 }

 function renderMonthCalendar() {
 const monthTitle = document.getElementById("monthTitle");
 const calendar = document.getElementById("monthCalendar");
 calendar.innerHTML = "";

 const year = currentMonthDate.getFullYear();
 const month = currentMonthDate.getMonth();

 monthTitle.innerText = currentMonthDate.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });

 const dayHeaders = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
 dayHeaders.forEach(h => {
 calendar.innerHTML += `<div class="month-day-header">${h}</div>`;
 });

 const firstDay = new Date(year, month, 1);
 const lastDay = new Date(year, month + 1, 0);

 let startingDay = firstDay.getDay() - 1;
 if (startingDay === -1) startingDay = 6;

 for (let i = 0; i < startingDay; i++) {
 calendar.innerHTML += `<div class="month-day other-month"></div>`;
 }

 for (let day = 1; day <= lastDay.getDate(); day++) {
 const dateObj = new Date(year, month, day);
 const dateStr = formatDate(dateObj);

 const activeBookings = myBookings.filter(b => b.sessionDate === dateStr && b.status === "Забронировано");
 const hasBooking = activeBookings.length > 0;

 const dayEl = document.createElement("div");
 dayEl.className = `month-day ${hasBooking ? 'has-booking' : ''} ${dateStr === selectedMyBookingDate ? 'selected' : ''}`;
 
 dayEl.innerHTML = `
 <div>${day}</div>
 ${hasBooking ? `<div class="booking-badge">${activeBookings.length} зап.</div>` : ''}
 `;

 dayEl.onclick = () => {
 selectedMyBookingDate = dateStr;
 document.querySelectorAll(".month-day").forEach(el => el.classList.remove("selected"));
 dayEl.classList.add("selected");
 renderMyBookingsForDate(dateStr);
 };

 calendar.appendChild(dayEl);
 }
 }

 function renderMonthlyStats() {
 const statsContainer = document.getElementById("monthlyStats");

 // [USER_V_STAT]: Если отключено — не отображать блок статистики
 if (appConfig.USER_V_STAT === false) {
 statsContainer.style.display = "none";
 return;
 }

 const year = currentMonthDate.getFullYear();
 const month = currentMonthDate.getMonth();

 const monthBookings = myBookings.filter(b => {
 if (b.status === "Отменено") return false;
 const d = new Date(b.sessionDate);
 return d.getFullYear() === year && d.getMonth() === month;
 });

 if (monthBookings.length === 0) {
 statsContainer.style.display = "none";
 return;
 }

 const statsMap = {};
 let totalSum = 0;
 let unpaidSum = 0;

 monthBookings.forEach(b => {
 const sec = b.section || "Тренировка";
 const price = Number(b.price) || 1500;
 
 if (!statsMap[sec]) {
 statsMap[sec] = { count: 0, sum: 0 };
 }
 statsMap[sec].count += 1;
 statsMap[sec].sum += price;
 totalSum += price;

 if (b.paymentStatus === "Не оплачено") {
 unpaidSum += price;
 }
 });

 const monthName = currentMonthDate.toLocaleDateString('ru-RU', { month: 'long' });
 let html = `<div class="stats-title">
 <span>📊 Статистика за ${monthName}</span>
 <span>Всего: ${totalSum.toLocaleString('ru-RU')} ₽</span>
 </div>`;

 for (let sec in statsMap) {
 const wordLessons = getPluralForm(statsMap[sec].count, 'занятие', 'занятия', 'занятий');
 html += `
 <div class="stats-item">
 <span><strong>${sec}</strong> — ${statsMap[sec].count} ${wordLessons}</span>
 <span>${statsMap[sec].sum.toLocaleString('ru-RU')} ₽</span>
 </div>
 `;
 }

 if (unpaidSum > 0) {
 html += `
 <div class="stats-unpaid">
 <span>К оплате (не оплачено):</span>
 <span>${unpaidSum.toLocaleString('ru-RU')} ₽</span>
 </div>
 `;
 }

 statsContainer.innerHTML = html;
 statsContainer.style.display = "block";
 }

 /**
  * [USER_V_SUB]: Отрисовка выпадающей таблицы абонементов за выбранный в календаре месяц и год
  */
 function renderSubscriptions() {
 const container = document.getElementById("subscriptionsContainer");
 if (!container) return;

 // Если функция отключена в настройках интеграции
 if (appConfig.USER_V_SUB === false) {
 container.style.display = "none";
 return;
 }

 const year = currentMonthDate.getFullYear();
 const month = currentMonthDate.getMonth() + 1; // В JS месяцы 0-11, а в таблице 1-12

 // Фильтрация записей только под выбранный месяц и год
 const filteredSubs = subscriptionsList.filter(s => 
 Number(s.year) === year && Number(s.month) === month
 );

 if (filteredSubs.length === 0) {
 container.style.display = "none";
 return;
 }

 const monthName = currentMonthDate.toLocaleDateString('ru-RU', { month: 'long' });

 let rowsHtml = filteredSubs.map(s => `
 <tr>
 <td><strong>${s.section}</strong></td>
 <td style="text-align: center;">${s.count} зан.</td>
 <td style="text-align: right; font-weight: bold;">${Number(s.price).toLocaleString('ru-RU')} ₽</td>
 </tr>
 `).join("");

 container.innerHTML = `
 <details style="width: 100%;">
 <summary class="sub-summary">
 💳 Информация об абонементах (${monthName} ${year}) ▼
 </summary>
 <table class="sub-table">
 <thead>
 <tr>
 <th>Направление / Секция</th>
 <th style="text-align: center;">Занятий</th>
 <th style="text-align: right;">Стоимость</th>
 </tr>
 </thead>
 <tbody>
 ${rowsHtml}
 </tbody>
 </table>
 </details>
 `;
 container.style.display = "block";
 }

 function changeMonth(offset) {
 currentMonthDate.setMonth(currentMonthDate.getMonth() + offset);
 renderMonthCalendar();
 renderMonthlyStats();
 renderSubscriptions(); // Перерисовка абонементов при смене месяца
 }

 function renderMyBookingsForDate(dateStr) {
 const container = document.getElementById("myBookingsList");
 container.innerHTML = "";

 const bookings = myBookings
 .filter(b => b.sessionDate === dateStr)
 .sort((a, b) => a.sessionTime.localeCompare(b.sessionTime));

 if (bookings.length === 0) {
 container.innerHTML = `<div class="loading">На выбранную дату (${dateStr}) записей нет.</div>`;
 return;
 }

 bookings.forEach(b => {
 const card = document.createElement("div");
 card.className = "card";

 let canCancel = b.canCancel && (appConfig.USER_CANCEL !== false);

 if (canCancel && appConfig.USER_CANCEL_TIME > 0 && b.sessionDate && b.sessionTime) {
 const sessionStart = new Date(`${b.sessionDate}T${b.sessionTime}`);
 const now = new Date();
 const diffMinutes = (sessionStart - now) / (1000 * 60);

 if (diffMinutes < Number(appConfig.USER_CANCEL_TIME)) {
 canCancel = false;
 }
 }

 card.innerHTML = `
 <div class="card-title">
 <span>${b.section}</span>
 <span class="card-badge badge-status">${b.status}</span>
 </div>
 <div class="card-subtitle">
 ⏰ Время: ${b.sessionTime}<br>
 👶 Ребёнок: ${b.childName} (${b.childBirthYear} г.р.)<br>
 💳 Оплата: ${b.paymentStatus}
 </div>
 <div style="font-size: 11px; color: var(--hint-color);">№ брони: ${b.bookingId}</div>
 ${canCancel ? `<button class="btn-cancel" onclick="cancelBooking('${b.bookingId}', '${b.sessionDate}', '${b.sessionTime}')">Отменить запись</button>` : ''}
 `;

 container.appendChild(card);
 });
 }

 function cancelBooking(bookingId, sessionDate, sessionTime) {
 if (appConfig.USER_CANCEL === false) {
 alert("Отмена бронирования отключена администратором.");
 return;
 }

 if (appConfig.USER_CANCEL_TIME > 0 && sessionDate && sessionTime) {
 const sessionStart = new Date(`${sessionDate}T${sessionTime}`);
 const now = new Date();
 const diffMinutes = (sessionStart - now) / (1000 * 60);

 if (diffMinutes < Number(appConfig.USER_CANCEL_TIME)) {
 alert(`Отмена записи невозможна! До начала тренировки осталось менее ${appConfig.USER_CANCEL_TIME} минут.`);
 return;
 }
 }

 if (!confirm("Вы уверены, что хотите отменить запись?")) return;

 fetch(API_URL, {
 method: "POST",
 redirect: "follow",
 headers: { "Content-Type": "text/plain;charset=utf-8" },
 body: JSON.stringify({
 action: "cancelBooking",
 bookingId: bookingId,
 chatId: currentChatId,
 phone: userPhone
 })
 })
 .then(res => res.text())
 .then(textData => {
 let res;
 try { res = JSON.parse(textData); } catch(e) { res = { status: "success" }; }
 
 if (res.status === "success") {
 showBanner("✅ Запись успешно отменена.");
 loadMyBookings();
 loadSchedule(false);
 } else {
 showBanner(`❌ Ошибка отмены: ${res.message}`, true);
 }
 })
 .catch(() => {
 showBanner("✅ Статус обновлен.");
 loadMyBookings();
 loadSchedule(false);
 });
 }

 function formatDate(d) {
 const year = d.getFullYear();
 const month = String(d.getMonth() + 1).padStart(2, '0');
 const day = String(d.getDate()).padStart(2, '0');
 return `${year}-${month}-${day}`;
 }

 function getPluralForm(n, one, two, many) {
 let num = Math.abs(n) % 100;
 let n1 = num % 10;
 if (num > 10 && num < 20) return many;
 if (n1 > 1 && n1 < 5) return two;
 if (n1 == 1) return one;
 return many;
 }
 </script>
